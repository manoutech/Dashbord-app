<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admindahboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-container">
        <header class="header">
            <div class="menu-icon" onclick="openSidebar()">
               <span class="material-symbols-outlined">menu</span>
            </div>
            <div class="header-left">
               <span class="material-symbols-outlined">search</span>
            </div>
            <div class="header-right">
               <span class="material-symbols-outlined">notifications</span>
               <span class="material-symbols-outlined">email</span>
               <span class="material-symbols-outlined">account_circle</span>
            </div>
        </header>
        <aside id="sidebar">
            <div class="sidebar-title">
               <div class="sidebar-brand">
                <span class="material-symbols-outlined">shopping_cart</span>STORE
               </div> 
               <span class="material-symbols-outlined" onclick="closeSidebar()">close</span>
            </div>

            <ul class="sidebar-list">
                <li class="sidebar-list-item">
                    <span class="material-symbols-outlined">dashboard</span>Dashboard
                </li>
                <li class="sidebar-list-item">
                    <span class="material-symbols-outlined">inventory-2</span>Products
                </li>
                <li class="sidebar-list-item">
                    <span class="material-symbols-outlined">category</span>Categories
                </li>
                <li class="sidebar-list-item">
                    <span class="material-symbols-outlined">groups</span>Customers
                </li>
                <li class="sidebar-list-item">
                    <span class="material-symbols-outlined">fact-check</span>Inventory
                </li>
                <li class="sidebar-list-item">
                    <span class="material-symbols-outlined">poll</span>Rapports
                </li>
                <li class="sidebar-list-item">
                    <span class="material-symbols-outlined">settings</span>Settings
                </li>
            </ul>
        </aside>
        <main class="main-container"></main>
    </div>

    <script src="script.js"></script>
</body>
</html>
